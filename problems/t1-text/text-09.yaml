id: text-09
category: 텍스트 처리
level: 1
prompt: |
  /work/scores.txt 에 점수가 한 줄에 하나씩 들어있다.
  작은 수부터 큰 수 순서로 정렬해 /work/rank.txt 에 저장하라.

  그냥 정렬하면 100 이 3 보다 앞에 온다. 숫자로 정렬해야 한다.

setup:
  cwd: /work
  files:
    /work/scores.txt: |
      100
      25
      3
      9
      40

check:
  - desc: rank.txt 가 존재함
    cmd: test -f /work/rank.txt
  - desc: rank.txt 가 5줄임 (빠진 점수 없음)
    cmd: '[ "$(wc -l < /work/rank.txt)" = 5 ]'
  - desc: 숫자 크기 순으로 정렬되어 있음
    cmd: sort -c -n /work/rank.txt
  - desc: 첫 줄이 3, 마지막 줄이 100 임
    cmd: '[ "$(head -1 /work/rank.txt)" = 3 ] && [ "$(tail -1 /work/rank.txt)" = 100 ]'

guard:
  - desc: 원본 scores.txt 는 5줄 그대로임
    cmd: '[ "$(wc -l < /work/scores.txt)" = 5 ]'

hints:
  - 정렬하는 명령은 sort 다. 다만 기본값은 글자 순서로 비교한다.
  - 숫자로 비교하게 만드는 옵션이 하나 있다.
  - 'sort -n /work/scores.txt > /work/rank.txt'

solution: sort -n /work/scores.txt > /work/rank.txt
