id: awk-01
category: awk 와 sed
level: 2
prompt: |
  awk 는 한 줄을 칸(필드)으로 쪼개서 $1, $2 … 로 부른다.

  /work/staff.csv 는 "이름,부서,나이" 형식이다.
  이름과 나이만 뽑아 "이름 나이" 형태로 /work/short.txt 에 저장하라.
  맨 윗줄(헤더)은 빼야 한다.

setup:
  cwd: /work
  files:
    /work/staff.csv: |
      name,dept,age
      kim,dev,31
      lee,sales,45
      park,dev,28
      choi,hr,39

check:
  - desc: short.txt 가 4줄임 (헤더 제외)
    cmd: '[ "$(wc -l < /work/short.txt)" = 4 ]'
  - desc: 헤더가 들어가지 않았음
    cmd: '[ -s /work/short.txt ] && ! grep -q "name" /work/short.txt'
  - desc: 이름과 나이만 공백으로 이어져 있음
    cmd: grep -q "^kim 31$" /work/short.txt && grep -q "^choi 39$" /work/short.txt
  - desc: 부서 이름이 섞이지 않았음
    cmd: '[ -s /work/short.txt ] && ! grep -q "dev" /work/short.txt'

hints:
  - awk 는 기본으로 공백을 기준으로 칸을 나눈다. 쉼표로 나누려면 -F, 를 붙인다.
  - '{print $1, $3} 은 첫 번째와 세 번째 칸을 출력한다. print 에서 쉼표는 공백 한 칸으로 나온다.'
  - 'NR 은 지금 몇 번째 줄인지를 담고 있다. NR>1 을 앞에 붙이면 첫 줄을 건너뛴다.'

solution: |
  awk -F, 'NR>1 {print $1, $3}' /work/staff.csv > /work/short.txt
