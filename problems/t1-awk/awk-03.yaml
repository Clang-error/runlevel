id: awk-03
category: awk 와 sed
level: 2
prompt: |
  /work/stock.csv 는 "품목,분류,수량" 형식이다.
  수량이 100 을 넘는 품목의 이름만 골라 /work/many.txt 에 저장하라.

  주의: 맨 윗줄은 헤더다. 헤더를 걸러내지 않으면 글자와 숫자를 비교하게 되어
  엉뚱하게 통과해버린다.

setup:
  cwd: /work
  files:
    /work/stock.csv: |
      item,category,qty
      bolt,metal,250
      nut,metal,80
      washer,metal,140
      screw,metal,100
      pipe,plastic,310

check:
  - desc: many.txt 가 3줄임
    cmd: '[ "$(wc -l < /work/many.txt)" = 3 ]'
  - desc: 100 을 넘는 품목만 들어 있음
    cmd: grep -q "^bolt$" /work/many.txt && grep -q "^washer$" /work/many.txt && grep -q "^pipe$" /work/many.txt
  - desc: 100 이하인 품목은 빠져 있음
    cmd: '[ -s /work/many.txt ] && ! grep -q "^nut$" /work/many.txt && ! grep -q "^screw$" /work/many.txt'
  - desc: 헤더가 섞이지 않았음
    cmd: '[ -s /work/many.txt ] && ! grep -q "^item$" /work/many.txt'

hints:
  - 패턴 자리에 비교식을 그대로 쓸 수 있다. $3 > 100 처럼.
  - 'awk 는 칸이 숫자로 보이면 숫자로, 아니면 글자로 비교한다. 헤더의 qty 는 글자라서 "qty" > "100" 이 참이 되어버린다.'
  - '조건 두 개는 && 로 잇는다: awk -F, ''NR>1 && $3 > 100 {print $1}'''

solution: |
  awk -F, 'NR>1 && $3 > 100 {print $1}' /work/stock.csv > /work/many.txt
