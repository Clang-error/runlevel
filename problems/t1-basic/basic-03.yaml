id: basic-03
category: 기본 탐색
level: 1
prompt: |
  /work 안에 이름이 . 으로 시작하는 숨김 파일이 3개 섞여 있다.
  ls 만으로는 보이지 않는다.

  숨김 파일 3개를 모두 찾아 /work/hidden 디렉터리를 만들고 그 안으로 옮겨라.
  숨김이 아닌 파일은 건드리지 않는다.

setup:
  cwd: /work
  files:
    /work/.env: |
      TOKEN=abc123
    /work/.secret: |
      do not read
    /work/.gitignore: |
      *.log
    /work/readme.txt: |
      보이는 파일
    /work/data.csv: |
      a,b,c

check:
  - desc: hidden 디렉터리가 생성되었음
    cmd: test -d /work/hidden
  - desc: 숨김 파일 3개가 모두 hidden 안에 있음
    cmd: test -f /work/hidden/.env && test -f /work/hidden/.secret && test -f /work/hidden/.gitignore
  - desc: /work 에 숨김 파일이 남아있지 않음
    cmd: '[ "$(ls -A /work | grep -c "^\.")" = 0 ]'

guard:
  - desc: 보이는 파일은 그대로임
    cmd: test -f /work/readme.txt && test -f /work/data.csv

hints:
  - 숨김 파일까지 보려면 ls 에 -a 를 붙인다.
  - 이름을 알았으면 mv 로 옮기면 된다. 여러 개를 한 번에 적어도 된다.
  - 'mkdir hidden 후 mv .env .secret .gitignore hidden/ 을 실행한다.'

solution: |
  mkdir /work/hidden
  mv /work/.env /work/.secret /work/.gitignore /work/hidden/
