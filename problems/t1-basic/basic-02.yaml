id: basic-02
category: 기본 탐색
level: 1
prompt: |
  지금 /work/a/b/c 에서 시작한다. 두 가지를 하라.

  1. 두 단계 위(/work/a)로 올라가서 up.txt 를 만든다
  2. 거기서 /work 로 돌아가 home.txt 를 만든다

setup:
  cwd: /work/a/b/c
  script: |
    mkdir -p /work/a/b/c

check:
  - desc: /work/a 에 up.txt 가 있음
    cmd: test -f /work/a/up.txt
  - desc: /work 에 home.txt 가 있음
    cmd: test -f /work/home.txt

guard:
  - desc: 시작 위치인 c 디렉터리는 비어 있음
    cmd: '[ "$(ls -A /work/a/b/c 2>/dev/null | wc -l)" = 0 ]'

hints:
  - .. 는 한 단계 위 디렉터리를 뜻한다. 두 단계는 ../.. 이다.
  - / 로 시작하는 경로는 어디에서 쓰든 같은 곳을 가리킨다. cd /work 는 한 번에 돌아간다.
  - 'cd ../.. 후 touch up.txt, 그다음 cd /work 후 touch home.txt.'

solution: |
  cd ../..
  touch up.txt
  cd /work
  touch home.txt
