id: perm-04
category: 권한
level: 4
prompt: |
  /work/scripts 안의 .sh 파일을 모두 실행 가능하게 만들어라.
  단 소유자만 실행할 수 있어야 하고(750), .sh 가 아닌 파일은 건드리지 마라.

setup:
  # setup 이 소유자를 일부러 지정한다. 자동 chown 이 그걸 덮으면 문제가 성립하지 않는다
  keepOwner: true
  cwd: /work
  user: student
  files:
    /work/scripts/build.sh: |
      #!/bin/bash
      echo build
    /work/scripts/deploy.sh: |
      #!/bin/bash
      echo deploy
    /work/scripts/notes.md: |
      실행 스크립트 모음
  script: |
    chmod 640 /work/scripts/build.sh /work/scripts/deploy.sh /work/scripts/notes.md
    chown -R student /work/scripts

check:
  - desc: .sh 파일 2개가 750 임
    cmd: '[ "$(find /work/scripts -name "*.sh" -perm 750 | wc -l)" = 2 ]'
  - desc: build.sh 가 실제로 실행됨
    cmd: su -s /bin/bash student -c '/work/scripts/build.sh' 2>/dev/null | grep -q build

guard:
  - desc: notes.md 권한은 그대로임
    cmd: '[ "$(stat -c %a /work/scripts/notes.md)" = 640 ]'

hints:
  - find 와 -exec 를 조합하면 여러 파일에 한 번에 적용할 수 있다.
  - 소유자 rwx=7, 그룹 rx=5, 기타 없음=0.

solution: find /work/scripts -name "*.sh" -exec chmod 750 {} +
