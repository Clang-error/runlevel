id: proc-02
category: 프로세스
level: 3
prompt: |
  /work/runaway.sh 가 백그라운드에서 계속 돌고 있다. 이 프로세스를 종료하라.

  같이 돌고 있는 /work/keep.sh 는 건드리면 안 된다.

setup:
  # 남이 띄운 프로세스를 죽이는 것은 관리자 일이지만, sudo 로 한다
  sudo: true
  cwd: /work
  script: |
    printf '#!/bin/bash\nwhile :; do sleep 5; done\n' > /work/runaway.sh
    printf '#!/bin/bash\nwhile :; do sleep 5; done\n' > /work/keep.sh
    chmod +x /work/runaway.sh /work/keep.sh
    setsid /work/runaway.sh >/dev/null 2>&1 &
    setsid /work/keep.sh >/dev/null 2>&1 &
    sleep 1

check:
  - desc: runaway.sh 가 더 이상 돌지 않음
    cmd: '! ps -o args 2>/dev/null | grep -q "[r]unaway.sh"'

guard:
  - desc: keep.sh 는 그대로 돌고 있음
    cmd: ps -o args 2>/dev/null | grep -q "[k]eep.sh"

hints:
  - 먼저 ps 로 PID 를 찾는다.
  - 종료는 kill PID 다. 안 죽으면 kill -9 PID.
  - pkill -f runaway.sh 처럼 이름으로 한 번에 죽일 수도 있다.

solution: |
  sudo kill $(ps -o pid,args | grep '[r]unaway.sh' | awk '{print $1}')
