id: pipe-06
category: 파이프라인
level: 1
prompt: |
  /work/raw.txt 를 두 가지로 가공하라. 원본은 그대로 둔다.

  1. 모두 대문자로 바꾼 것 → /work/upper.txt
  2. 숫자를 전부 지운 것 → /work/nodigit.txt

setup:
  cwd: /work
  files:
    /work/raw.txt: |
      alpha1 bravo2
      charlie3 delta4
      echo5 foxtrot6

check:
  - desc: upper.txt 가 모두 대문자임
    cmd: '[ -s /work/upper.txt ] && grep -q "^ALPHA1 BRAVO2$" /work/upper.txt && ! grep -q "[a-z]" /work/upper.txt'
  - desc: upper.txt 가 3줄임
    cmd: '[ "$(wc -l < /work/upper.txt)" = 3 ]'
  - desc: nodigit.txt 에 숫자가 없음
    cmd: '[ -s /work/nodigit.txt ] && ! grep -q "[0-9]" /work/nodigit.txt'
  - desc: nodigit.txt 에 글자는 그대로 남아 있음
    cmd: grep -q "^alpha bravo$" /work/nodigit.txt

guard:
  - desc: 원본 raw.txt 는 그대로임
    cmd: grep -q "^alpha1 bravo2$" /work/raw.txt

hints:
  - tr 은 글자를 다른 글자로 바꾸거나 지운다. 파일 이름을 인자로 받지 않고 흘러들어온 입력만 처리한다.
  - '범위로 적을 수 있다: tr ''a-z'' ''A-Z'' 는 소문자를 대문자로 바꾼다.'
  - '-d 는 지우기다: tr -d ''0-9''. 입력은 < 로 넣거나 cat 파일 | 로 넘긴다.'

solution: |
  tr 'a-z' 'A-Z' < /work/raw.txt > /work/upper.txt
  tr -d '0-9' < /work/raw.txt > /work/nodigit.txt
