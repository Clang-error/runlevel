id: pipe-02
category: 파이프라인
level: 3
prompt: |
  /work/users.csv 에서 부서가 dev 인 사람의 이름만 골라
  알파벳 순으로 /work/dev.txt 에 저장하라.

  형식은 이름,부서,나이 다. 헤더 줄은 제외한다.

setup:
  cwd: /work
  files:
    /work/users.csv: |
      name,team,age
      hana,dev,29
      minu,sales,31
      jisu,dev,25
      yuna,hr,40
      chan,dev,33

check:
  - desc: dev.txt 가 존재함
    cmd: test -s /work/dev.txt
  - desc: 3명임
    cmd: '[ "$(wc -l < /work/dev.txt)" = 3 ]'
  - desc: 정렬된 chan hana jisu 임
    cmd: '[ "$(tr "\n" " " < /work/dev.txt)" = "chan hana jisu " ]'

hints:
  - 쉼표로 나뉜 칸은 awk -F, 로 다룬다.
  - 조건은 awk -F, '$2=="dev"' 처럼 쓴다. 헤더는 NR>1 로 거른다.
  - 이름만 남긴 뒤 sort 로 정렬한다.

solution: awk -F, 'NR>1 && $2=="dev" {print $1}' /work/users.csv | sort > /work/dev.txt
