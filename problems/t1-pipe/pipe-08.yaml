id: pipe-08
category: 파이프라인
level: 2
prompt: |
  /work/hosts.txt 에 서버 이름이 한 줄에 하나씩 12개 적혀 있다.
  배포를 4대씩 나눠 돌리려고 한다.

  순서를 유지한 채 4개씩 한 줄로 묶어 /work/batches.txt 에 저장하라.
  (총 3줄이 되고, 한 줄 안의 이름은 공백으로 구분한다)

setup:
  cwd: /work
  files:
    /work/hosts.txt: |
      web01
      web02
      web03
      web04
      api01
      api02
      api03
      api04
      db01
      db02
      cache01
      cache02

check:
  - desc: batches.txt 가 3줄임
    cmd: '[ "$(wc -l < /work/batches.txt)" = 3 ]'
  - desc: 첫 줄이 web 4대임
    cmd: '[ "$(sed -n 1p /work/batches.txt)" = "web01 web02 web03 web04" ]'
  - desc: 둘째 줄이 api 4대임
    cmd: '[ "$(sed -n 2p /work/batches.txt)" = "api01 api02 api03 api04" ]'
  - desc: 셋째 줄이 나머지 4대임
    cmd: '[ "$(sed -n 3p /work/batches.txt)" = "db01 db02 cache01 cache02" ]'

guard:
  - desc: 원본 hosts.txt 는 12줄 그대로임
    cmd: '[ "$(wc -l < /work/hosts.txt)" = 12 ]'

hints:
  - xargs 는 들어온 줄을 하나씩 넘기지 않는다. 모을 수 있는 만큼 모아 한 번에 인자로 붙인다. 그 묶음 크기를 정하는 게 -n 이다.
  - '-n 4 를 주면 인자 4개마다 명령을 한 번씩 실행한다. 실행할 명령으로 echo 를 쓰면 4개가 한 줄로 찍힌다.'
  - '입력은 파이프로 넣어도 되고 < 로 넣어도 된다: xargs -n 4 echo < 파일'

solution: |
  xargs -n 4 echo < /work/hosts.txt > /work/batches.txt
