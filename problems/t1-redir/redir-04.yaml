id: redir-04
category: 리다이렉션
level: 2
prompt: |
  같은 명령 ls /etc/hostname /work/nope 를 두 가지 방식으로 처리하라.

  1. 정상 결과와 에러를 한곳에 몰아서 /work/all.txt 에 담는다 (2줄이 된다)
  2. 에러는 아예 버리고 정상 결과만 /work/quiet.txt 에 담는다 (1줄이 된다)

setup:
  cwd: /work

check:
  - desc: all.txt 가 2줄임
    cmd: '[ "$(wc -l < /work/all.txt)" = 2 ]'
  - desc: all.txt 에 정상 결과와 에러가 함께 있음
    cmd: grep -q "/etc/hostname" /work/all.txt && grep -qi "no such" /work/all.txt
  - desc: quiet.txt 가 1줄임
    cmd: '[ "$(wc -l < /work/quiet.txt)" = 1 ]'
  - desc: quiet.txt 에 에러가 들어있지 않음
    cmd: '[ -s /work/quiet.txt ] && ! grep -qi "no such" /work/quiet.txt'

hints:
  - 2>&1 은 "2번을 1번이 가는 곳으로 함께 보내라"는 뜻이다.
  - '순서가 중요하다. > all.txt 2>&1 은 되지만 2>&1 > all.txt 는 1번의 목적지가 아직 화면일 때 복사돼서 안 된다.'
  - '/dev/null 은 무엇을 넣어도 사라지는 특수 파일이다. 2>/dev/null 이면 에러만 버려진다.'

solution: |
  ls /etc/hostname /work/nope > /work/all.txt 2>&1
  ls /etc/hostname /work/nope > /work/quiet.txt 2>/dev/null
