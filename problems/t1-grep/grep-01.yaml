id: grep-01
category: grep
level: 2
prompt: |
  /work/src 안의 모든 파일에서 TODO 가 들어간 줄을 찾아
  "파일경로:줄내용" 형식으로 /work/todo.txt 에 저장하라.

  /work 에는 src 말고 다른 파일도 있다. src 안만 찾아야 한다.

setup:
  cwd: /work
  script: |
    mkdir -p /work/src/lib
    printf 'int main(){}\n// TODO: 예외 처리\n' > /work/src/main.c
    printf '// 정상\n' > /work/src/ok.c
    printf '# TODO: 리팩터링\nprint(1)\n' > /work/src/lib/util.py
    printf '# TODO: 이 파일은 src 밖이라 포함하면 안 된다\n' > /work/notes.md

check:
  - desc: todo.txt 가 존재함
    cmd: test -s /work/todo.txt
  - desc: 2줄임
    cmd: '[ "$(wc -l < /work/todo.txt)" = 2 ]'
  - desc: main.c 와 util.py 가 파일 경로와 함께 적혀 있음
    cmd: grep -q 'main\.c:' /work/todo.txt && grep -q 'util\.py:' /work/todo.txt
  - desc: src 바깥의 notes.md 는 포함되지 않음
    cmd: '[ -s /work/todo.txt ] && ! grep -q notes\.md /work/todo.txt'

hints:
  - 하위 디렉터리까지 뒤지려면 grep -r 를 쓴다.
  - 찾을 디렉터리를 인자로 정확히 지정해야 한다. 생략하면 현재 위치 전체를 뒤진다.
  - grep -r 는 결과 앞에 파일 경로를 자동으로 붙여준다.

solution: grep -r TODO /work/src > /work/todo.txt
