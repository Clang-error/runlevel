id: grep-03
category: grep
level: 3
prompt: |
  /work/config 안에서 주석(#으로 시작)과 빈 줄을 뺀
  실제 설정 줄만 모아 /work/active.conf 에 저장하라.

setup:
  cwd: /work
  files:
    /work/config: |
      # 데이터베이스 설정
      host = db.internal

      # 캐시
      cache = on

      port = 5432
      # 끝

check:
  - desc: active.conf 가 존재함
    cmd: test -s /work/active.conf
  - desc: 3줄임
    cmd: '[ "$(wc -l < /work/active.conf)" = 3 ]'
  - desc: 주석이 없음
    cmd: '[ -s /work/active.conf ] && ! grep -q "^#" /work/active.conf'
  - desc: 빈 줄이 없음
    cmd: '[ -s /work/active.conf ] && ! grep -qE "^$" /work/active.conf'

hints:
  - grep -v 는 조건에 맞지 않는 줄만 남긴다.
  - 주석 줄은 ^# , 빈 줄은 ^$ 로 표현한다.
  - grep -vE '^#|^$' 처럼 | 로 두 조건을 한 번에 걸 수 있다.

solution: grep -vE '^#|^$' /work/config > /work/active.conf
