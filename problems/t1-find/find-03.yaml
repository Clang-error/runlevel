id: find-03
category: find
level: 3
prompt: |
  /work/logs 안의 .log 파일을 모두 찾아 권한을 644 로 바꿔라.
  디렉터리는 건드리지 마라.

setup:
  cwd: /work
  script: |
    mkdir -p /work/logs/old
    touch /work/logs/a.log /work/logs/b.log /work/logs/old/c.log /work/logs/note.txt
    chmod 600 /work/logs/a.log /work/logs/b.log /work/logs/old/c.log
    chmod 600 /work/logs/note.txt
    chmod 755 /work/logs/old

check:
  - desc: .log 파일 3개가 모두 644 임
    cmd: '[ "$(find /work/logs -name "*.log" -perm 644 | wc -l)" = 3 ]'

guard:
  - desc: 디렉터리 권한은 그대로임
    cmd: '[ "$(stat -c %a /work/logs/old)" = 755 ]'
  - desc: .log 가 아닌 파일은 그대로임
    cmd: '[ "$(stat -c %a /work/logs/note.txt)" = 600 ]'

hints:
  - find 로 찾은 각 파일에 명령을 실행하려면 -exec 를 쓴다.
  - -exec chmod 644 {} \; 에서 {} 가 찾은 파일로 바뀐다. 끝에 \; 가 필요하다.
  - -exec ... {} + 형태를 쓰면 여러 파일을 한 번에 넘겨 더 빠르다.

solution: find /work/logs -name "*.log" -exec chmod 644 {} +
