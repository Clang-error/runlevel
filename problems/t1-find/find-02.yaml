id: find-02
category: find
level: 3
prompt: |
  /work/data 안에서 크기가 1KB 를 넘는 파일만 찾아
  /work/big.txt 에 경로를 저장하라.

  /work 에는 data 밖에도 큰 파일이 있다. data 안만 찾아야 한다.

setup:
  cwd: /work
  script: |
    mkdir -p /work/data
    dd if=/dev/zero of=/work/data/big1.bin bs=1k count=4 2>/dev/null
    dd if=/dev/zero of=/work/data/big2.bin bs=1k count=10 2>/dev/null
    echo tiny > /work/data/small1.txt
    echo tiny > /work/data/small2.txt
    dd if=/dev/zero of=/work/outside-big.bin bs=1k count=8 2>/dev/null

check:
  - desc: big.txt 가 존재함
    cmd: test -s /work/big.txt
  - desc: 큰 파일 2개가 들어있음
    cmd: '[ "$(grep -c bin /work/big.txt)" = 2 ]'
  - desc: 작은 파일은 들어있지 않음
    cmd: '[ -s /work/big.txt ] && ! grep -q small /work/big.txt'
  - desc: data 바깥의 파일은 포함되지 않음
    cmd: '[ -s /work/big.txt ] && ! grep -q outside-big /work/big.txt'

hints:
  - find 의 크기 조건은 -size 
  - 1KB 초과는 +1k 로 쓴다. c(바이트) k(킬로) M(메가) 단위를 붙일 수 있다.

solution: find /work/data -type f -size +1k > /work/big.txt
